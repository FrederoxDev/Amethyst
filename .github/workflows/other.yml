name: Release new Amethyst Runtime (#2)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PROJECT_NAME: AmethystRuntime

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Checkout Amethyst repository
      - name: Checkout Amethyst
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Setup MSVC and Visual Studio Build Tools
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Install Chocolatey packages
      - name: Install Build Tools via Chocolatey
        shell: powershell
        run: |
          choco install xmake -y
          choco install ninja -y
          choco install git -y
          choco install deno -y
          choco install nim -y
          
          # Add Chocolatey's bin directory to the GitHub Actions PATH for all subsequent steps
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          refreshenv

      # Add xmake to PATH
      - name: Add xmake to PATH
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          version: 'latest'

      # Install NASM (in temp folder only, not saved in repo)
      - name: Install NASM
        shell: pwsh
        run: |
          $nasmUrl = "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip"
          $nasmZip = "$env:TEMP\nasm.zip"
          Invoke-WebRequest $nasmUrl -OutFile $nasmZip
          Expand-Archive $nasmZip -DestinationPath C:\nasm -Force
          echo "C:\nasm\nasm-2.16.03" >> $env:GITHUB_PATH

      # Add the Amethyst API so it recognizes it when building
      - name: Add AmethystAPI
        shell: powershell
        run: |
          $destination = Join-Path $env:USERPROFILE "Documents/Amethyst"
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/FrederoxDev/Amethyst $destination
          echo "AMETHYST_SRC=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      # Build the Amethyst API so we can link against it
      - name: Build AmethystAPI
        run: |
          cd "$env:AMETHYST_SRC"
          xmake build -v

      # Build with MSVC
      - name: Build with MSVC
        run: xmake build -v

      # Package the build artifacts (only dll, pdb, and mod.json)
      - name: Package AmethystRuntime
        shell: pwsh
        run: |
          $zipName = "$env:PROJECT_NAME@$env:VERSION.zip"
          $tempPath = "$env:TEMP\runtime_temp"
          Remove-Item $tempPath -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tempPath

          # Hardcoded paths for the build artifacts as requested
          $dllFullPath = "C:\Users\runneradmin\AppData\Local\Packages\Microsoft.MinecraftUWP_8wekyb3d8bbwe\LocalState\games\com.mojang\amethyst\mods\AmethystRuntime@2.0.0\AmethystRuntime.dll"
          $pdbFullPath = "C:\Users\runneradmin\AppData\Local\Packages\Microsoft.MinecraftUWP_8wekyb3d8bbwe\LocalState\games\com.mojang\amethyst\mods\AmethystRuntime@2.0.0\AmethystRuntime.pdb"

          # Copy only required runtime outputs
          if (Test-Path $dllFullPath) {
            Write-Host "Found DLL at: $dllFullPath"
            Copy-Item $dllFullPath -Destination $tempPath
          } else {
            Write-Host "DLL not found at: $dllFullPath"
          }

          if (Test-Path $pdbFullPath) {
            Write-Host "Found PDB at: $pdbFullPath"
            Copy-Item $pdbFullPath -Destination $tempPath
          } else {
            Write-Host "PDB not found at: $pdbFullPath"
          }

          # Copy mod.json
          Copy-Item "mod.json" $tempPath -Force

          # Zip only those files
          Compress-Archive -Path "$tempPath\*" -DestinationPath $zipName -Force
          echo "Created package: $zipName"

      # Bump the version in mod.json and push the changes
      - name: Bump version and push changes
        shell: pwsh
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Use Deno to read, update, and write the mod.json file
          deno run --allow-read --allow-write --allow-env - << 'EOF'
          import { readJson, writeJson } from "https://deno.land/x/jsonc@1.1.0/mod.ts";
          
          const filePath = "mod.json";
          const mod = await readJson(filePath);
          
          if (mod.version && Array.isArray(mod.version)) {
            mod.version[2] += 1; // Increment the patch version
          } else {
            console.error("Version array not found or invalid in mod.json");
            Deno.exit(1);
          }
          
          await writeJson(filePath, mod, { spaces: 2 });
          console.log("Updated mod.json with new version");
          EOF
          
          # Check for changes and commit
          $changes = git status --porcelain
          if ($changes) {
              git add mod.json
              git commit -m "Build AmethystRuntime version $env:VERSION"
              git push
              Write-Host "Committed and pushed version changes"
          } else {
              Write-Host "No changes to commit"
          }

      # Create GitHub Release and Upload Release Asset
      - name: Create and Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v${{ env.VERSION }}
          name: AmethystRuntime ${{ env.VERSION }}
          files: ${{ env.PROJECT_NAME }}@${{ env.VERSION }}.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
