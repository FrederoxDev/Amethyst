name: Release new Amethyst Runtime (#2)

on:
  workflow_dispatch:

env:
  PROJECT_NAME: AmethystRuntime

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Checkout Amethyst Runtime repository
      - name: Checkout Amethyst Runtime
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Setup MSVC and Visual Studio Build Tools
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Install Chocolatey packages
      - name: Install Build Tools via Chocolatey
        shell: powershell
        run: |
          choco install xmake -y
          choco install ninja -y
          choco install git -y
          choco install nim -y
          
          # Add Chocolatey's bin directory to the GitHub Actions PATH for all subsequent steps
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH

      # Add xmake to PATH
      - name: Add xmake to PATH
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          version: 'latest'

      # Install NASM (in temp folder only, not saved in repo)
      - name: Install NASM
        shell: pwsh
        run: |
          $nasmUrl = "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip"
          $nasmZip = "$env:TEMP\nasm.zip"
          Invoke-WebRequest $nasmUrl -OutFile $nasmZip
          Expand-Archive $nasmZip -DestinationPath C:\nasm -Force
          echo "C:\nasm\nasm-2.16.03" >> $env:GITHUB_PATH

      # Setup Deno
      - name: Setup Deno
        uses: denoland/setup-deno@v2.0.3

      # Add the Amethyst API so it recognizes it when building
      - name: Add AmethystAPI
        shell: powershell
        run: |
          $destination = Join-Path $env:USERPROFILE "Documents/Amethyst"
          git clone --recursive https://github.com/FrederoxDev/Amethyst $destination
          echo "AMETHYST_SRC=$destination" >> $env:GITHUB_ENV

      # Configure AmethystAPI build mode
      - name: Configure AmethystAPI
        run: |
          cd "$env:AMETHYST_SRC"
          xmake f --mode=release

      # Build the Amethyst API so we can link against it
      - name: Build AmethystAPI
        run: |
          cd "$env:AMETHYST_SRC"
          xmake build AmethystAPI

      # Get version from mod.json and set env variable for subsequent steps
      - name: Get version from mod.json
        id: get_version
        shell: pwsh
        run: |
          $json = Get-Content "mod.json" -Raw | ConvertFrom-Json
          $version = $json.meta.version
          $versionParts = $version.Split('.')
          $version = "$($versionParts[0]).$($versionParts[1]).$($versionParts[2])"
          echo "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version set to: $version"

      # Configure runtime build mode
      - name: Configure runtime
        run: xmake f --mode=release

      # Build with MSVC
      - name: Build with MSVC
        run: xmake build -v

      # Find the DLL and PDB files
      - name: Find Build Artifacts
        id: find_artifacts
        shell: pwsh
        run: |
          echo "=== Searching for AmethystRuntime.dll and AmethystRuntime.pdb ==="
          
          # Search common build paths for the files
          $searchPaths = @(
              ".",
              "build",
              ".xmake",
              "$env:USERPROFILE",
              "C:\Users\runneradmin",
              "C:\"
          )
          
          $dllPath = $null
          $pdbPath = $null
          
          foreach ($path in $searchPaths) {
              if (Test-Path $path) {
                  echo "--- Searching in $path ---"
                  $found = Get-ChildItem -Path $path -Recurse -File -ErrorAction SilentlyContinue | Where-Object { 
                      ($_.Name -eq "AmethystRuntime.dll") -or ($_.Name -eq "AmethystRuntime.pdb")
                  }
          
                  if ($found) {
                      foreach ($file in $found) {
                          if ($file.Name -eq "AmethystRuntime.dll") {
                              $dllPath = $file.FullName
                          }
                          if ($file.Name -eq "AmethystRuntime.pdb") {
                              $pdbPath = $file.FullName
                          }
                      }
                  }
              }
              if ($dllPath -and $pdbPath) {
                  break
              }
          }
          
          if ($dllPath) {
              echo "AMETHYST_DLL_PATH=$dllPath" | Out-File -FilePath $env:GITHUB_ENV -Append
              echo "SUCCESS: Found AmethystRuntime.dll at $dllPath"
          } else {
              echo "ERROR: AmethystRuntime.dll not found."
              exit 1
          }

          if ($pdbPath) {
              echo "AMETHYST_PDB_PATH=$pdbPath" | Out-File -FilePath $env:GITHUB_ENV -Append
              echo "SUCCESS: Found AmethystRuntime.pdb at $pdbPath"
          } else {
              echo "WARNING: AmethystRuntime.pdb not found. Skipping PDB."
          }

      # Package the build artifacts from their found locations
      - name: Package AmethystRuntime
        shell: pwsh
        run: |
          $zipName = "$env:PROJECT_NAME@$env:VERSION.zip"
          $tempPath = "$env:TEMP\runtime_temp"
          Remove-Item $tempPath -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tempPath
          
          if (Test-Path $env:AMETHYST_DLL_PATH) {
              Copy-Item $env:AMETHYST_DLL_PATH $tempPath -Force
              echo "Copied DLL from: $env:AMETHYST_DLL_PATH"
          } else {
              echo "ERROR: DLL not found at $env:AMETHYST_DLL_PATH"
              exit 1
          }
          
          if (Test-Path $env:AMETHYST_PDB_PATH) {
              Copy-Item $env:AMETHYST_PDB_PATH $tempPath -Force
              echo "Copied PDB from: $env:AMETHYST_PDB_PATH"
          } else {
              echo "WARNING: PDB not found. Skipping PDB copy."
          }

          Copy-Item "mod.json" $tempPath -Force
          echo "Copied mod.json"
          
          echo "=== PACKAGING THESE FILES ==="
          Get-ChildItem $tempPath | ForEach-Object { echo "  $($_.Name)" }
          
          Compress-Archive -Path "$tempPath\*" -DestinationPath $zipName -Force
          echo "Created package: $zipName"

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AmethystRuntime ${{ env.VERSION }}
          files: ${{ env.PROJECT_NAME }}@${{ env.VERSION }}.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bump the version in mod.json and push the changes
      - name: Bump version in mod.json and push
        shell: pwsh
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Deno script content
          $denoScript = @'
          import { readJson, writeJson } from "https://deno.land/x/jsonc@1.1.0/mod.ts";
          
          const filePath = "mod.json";
          const mod = await readJson(filePath);
          
          if (mod.version && Array.isArray(mod.version)) {
            mod.version[2] += 1; // Increment the patch version
          } else {
            console.error("Version array not found or invalid in mod.json");
            Deno.exit(1);
          }
          
          await writeJson(filePath, mod, { spaces: 2 });
          console.log("Updated mod.json with new version");
          '@

          # Write Deno script to a temporary file
          $denoScriptPath = Join-Path $env:TEMP "bump_version.ts"
          Set-Content -Path $denoScriptPath -Value $denoScript

          # Execute the Deno script
          deno run --allow-read --allow-write --allow-env $denoScriptPath
          
          # Check for changes and commit
          $changes = git status --porcelain
          if ($changes) {
              git add mod.json
              git commit -m "Build: Bump version for next build"
              git push
              Write-Host "Committed and pushed version changes"
          } else {
              Write-Host "No changes to commit"
          }
