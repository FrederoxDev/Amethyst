name: Debug Search Workflow

on:
  workflow_dispatch:

jobs:
  find-artifacts:
    runs-on: windows-latest
    steps:
      - name: Debug - Search for Amethyst Runtime DLL/PDB
        shell: pwsh
        run: |
          echo "=== Searching for AmethystRuntime.dll and AmethystRuntime.pdb ==="
          
          # Search common build paths for the files
          $searchPaths = @(
              ".",
              "build",
              ".xmake",
              "$env:USERPROFILE",
              "C:\Users\runneradmin"
          )

          $foundFiles = @()

          foreach ($path in $searchPaths) {
              if (Test-Path $path) {
                  echo "--- Searching in $path ---"
                  $results = Get-ChildItem -Path $path -Recurse -File -ErrorAction SilentlyContinue | Where-Object { 
                      ($_.Name -eq "AmethystRuntime.dll") -or ($_.Name -eq "AmethystRuntime.pdb")
                  }
                  if ($results) {
                      $foundFiles += $results
                      $results | Format-Table Name, Directory, FullName
                  }
              }
          }
          
          if ($foundFiles.Count -eq 0) {
              echo "WARNING: Could not find AmethystRuntime.dll or AmethystRuntime.pdb in common locations."
              echo "Performing a full drive search. This may take a long time."
          
              # Fallback to an entire C:\ drive search
              $results = Get-ChildItem -Path "C:\" -Recurse -File -ErrorAction SilentlyContinue | Where-Object { 
                  ($_.Name -eq "AmethystRuntime.dll") -or ($_.Name -eq "AmethystRuntime.pdb")
              }
          
              if ($results) {
                  $foundFiles += $results
                  $results | Format-Table Name, Directory, FullName
              }
          }

          if ($foundFiles.Count -gt 0) {
              echo "SUCCESS: Found the following files:"
              $foundFiles | Format-Table Name, Directory, FullName
          } else {
              echo "ERROR: Failed to find AmethystRuntime.dll or AmethystRuntime.pdb anywhere on the runner."
              exit 1
          }
