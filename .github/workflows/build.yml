name: Release new Amethyst Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_NAME: AmethystRuntime

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      # Checkout Amethyst repository
      - name: Checkout Amethyst
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Setup MSVC and Visual Studio Build Tools
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Install Chocolatey packages
      - name: Install Build Tools via Chocolatey
        shell: powershell
        run: |
          # Install chocolatey packages
          choco install xmake -y
          choco install ninja -y
          choco install git -y
          choco install deno -y
          choco install nim -y
          
          # Refresh environment to get new PATH
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          refreshenv

        # Add the Amethyst API so it recognizes it when building
      - name: Add AmethystAPI
        shell: powershell
        run: |
          $destination = Join-Path $env:USERPROFILE "Documents/Amethyst"
          git clone https://github.com/FrederoxDev/Amethyst.git $destination
          [System.Environment]::SetEnvironmentVariable("amethyst_src", $destination, "User")

        # Add xmake to PATH
      - name: Add xmake to PATH
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          version: 'latest'

      # Install additional tools if needed
      - name: Install Additional Tools
        shell: powershell
        run: |
          # Install NASM if needed for assembly
          Invoke-WebRequest https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip -OutFile nasm.zip
          Expand-Archive nasm.zip -DestinationPath C:\nasm
          $Env:PATH = "C:\nasm\nasm-2.16.03;$Env:PATH"
          echo "C:\nasm\nasm-2.16.03" >> $env:GITHUB_PATH

      - name: Get or bump version
        id: get_version
        shell: powershell
        run: |
          # Try to read version from a version file, or generate one
          if (Test-Path "VERSION") {
              $VERSION = Get-Content "VERSION" -Raw
              $VERSION = $VERSION.Trim()
          } elseif (Test-Path "xmake.lua") {
              # Try to extract version from xmake.lua
              $content = Get-Content "xmake.lua" -Raw
              if ($content -match 'set_version\("([^"]+)"\)') {
                  $VERSION = $matches[1]
              } else {
                  $VERSION = "1.0.0"
              }
          } else {
              # Generate version based on date and commit
              $DATE = Get-Date -Format "yyyy.MM.dd"
              $SHORT_SHA = git rev-parse --short HEAD
              $VERSION = "$DATE.$SHORT_SHA"
          }
          
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV
          echo "Version set to: $VERSION"

      # Build with xmake and MSVC
      - name: Configure xmake
        shell: powershell
        run: |
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          refreshenv
          
          mkdir build -ErrorAction SilentlyContinue
          cd build

      - name: Build with MSVC
        shell: powershell
        run: |
          cd build
          xmake config --mode=debug
          xmake --verbose

      # Run tests if they exist
      - name: Run Tests
        shell: powershell
        run: |
          cd build
          ctest --output-on-failure --parallel --build-config Release
        continue-on-error: true

      # Package the build artifacts
      - name: Package AmethystRuntime
        shell: powershell
        run: |
          $zipName = "$env:PROJECT_NAME@$env:VERSION.zip"
          $buildPath = "build"
          
          # Create temp directory for packaging
          $tempPath = "$env:TEMP\runtime_temp"
          Remove-Item $tempPath -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tempPath
          
          # Copy runtime files (adjust paths based on your build output)
          if (Test-Path "$buildPath\Release") {
              Copy-Item "$buildPath\Release\*" $tempPath -Recurse -Force
          }
          if (Test-Path "$buildPath\Debug") {
              Copy-Item "$buildPath\Debug\*" "$tempPath\Debug" -Recurse -Force
          }
          
          # Copy additional files if they exist
          $additionalFiles = @("README.md", "LICENSE", "docs")
          foreach ($file in $additionalFiles) {
              if (Test-Path $file) {
                  Copy-Item $file $tempPath -Recurse -Force
              }
          }
          
          # Remove unwanted files
          $excluded = Get-ChildItem -Path $tempPath -Recurse -File | Where-Object { 
              $_.Extension -in ".lib", ".exp", ".pdb", ".ilk", ".obj" 
          }
          foreach ($file in $excluded) {
              Remove-Item $file.FullName -Force -ErrorAction SilentlyContinue
          }
          
          # Create zip
          Compress-Archive -Path "$tempPath\*" -DestinationPath $zipName
          echo "Created package: $zipName"

      # Commit version changes if any were made
      - name: Commit version changes
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only commit if there are changes
          $changes = git status --porcelain
          if ($changes) {
              git add .
              git commit -m "Build AmethystRuntime version $env:VERSION"
              git push
              echo "Committed version changes"
          } else {
              echo "No changes to commit"
          }

      # Create GitHub Release
      - name: Create GitHub Release
        id: create_release
        run: |
          $tag_name = "v$env:VERSION"
          $release_name = "AmethystRuntime $env:VERSION"
          $release_notes = @"
          ## AmethystRuntime Release $env:VERSION
          
          ### Changes
          - Built with MSVC on Windows
          - Manual build from commit $(git rev-parse --short HEAD)
          
          ### Build Information
          - **Platform**: Windows x64
          - **Compiler**: MSVC (Visual Studio 2022)
          - **Build Tool**: XMake
          - **Build Type**: Release
          - **Built on**: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')
          "@
          
          gh release create $tag_name --title "$release_name" --notes "$release_notes" --target main --repo ${{ github.repository }} --draft=false --prerelease=false
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload Release Asset
      - name: Upload Release Asset
        run: |
          $asset_path = "AmethystRuntime@$env:VERSION.zip"
          $asset_label = "AmethystRuntime@$env:VERSION.zip"
          gh release upload "v$env:VERSION" "$asset_path#$asset_label" --repo ${{ github.repository }}
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload build artifacts for workflow runs (always available)
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AmethystRuntime-${{ env.VERSION }}-windows-msvc
          path: |
            AmethystRuntime@${{ env.VERSION }}.zip
            build/
            mod.json
          retention-days: 30