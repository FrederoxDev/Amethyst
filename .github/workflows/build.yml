name: Release new Amethyst Runtime

on:
  workflow_dispatch:

env:
  PROJECT_NAME: AmethystRuntime

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      # Checkout Amethyst repository
      - name: Checkout Amethyst
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Setup MSVC and Visual Studio Build Tools
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Install Chocolatey packages
      - name: Install Build Tools via Chocolatey
        shell: pwsh
        run: |
          choco install xmake -y
          choco install git -y
          choco install deno -y
          choco install nim -y
          Import-Module $env:ChocolateyInstall\helpers\chocolateyProfile.psm1
          refreshenv

      # Add xmake to PATH
      - name: Add xmake to PATH
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          version: 'latest'

      # Install NASM (in temp folder only, not saved in repo)
      - name: Install NASM
        shell: pwsh
        run: |
          $nasmUrl = "https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip"
          $nasmZip = "$env:TEMP\nasm.zip"
          Invoke-WebRequest $nasmUrl -OutFile $nasmZip
          Expand-Archive $nasmZip -DestinationPath C:\nasm -Force
          echo "C:\nasm\nasm-2.16.03" >> $env:GITHUB_PATH

      # 🔑 Get version from mod.json
      - name: Get version from mod.json
        id: get_version
        shell: pwsh
        run: |
          $json = Get-Content "mod.json" -Raw | ConvertFrom-Json
          $VERSION = $json.meta.version
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV
          echo "Version set to: $VERSION"

      # Build with xmake and MSVC
      - name: Configure xmake
        shell: pwsh
        run: |
          xmake f --toolchain=msvc --arch=x64 --mode=release -y

      - name: Build with MSVC
        shell: pwsh
        run: |
          xmake build

      # Package the build artifacts (only dll, pdb, and mod.json)
      - name: Package AmethystRuntime
        shell: pwsh
        run: |
          $zipName = "$env:PROJECT_NAME@$env:VERSION.zip"
          $tempPath = "$env:TEMP\runtime_temp"
          Remove-Item $tempPath -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tempPath

          # Copy only required runtime outputs
          $dllPath = Get-ChildItem -Path build -Recurse -Filter "AmethystRuntime.dll" | Select-Object -First 1
          $pdbPath = Get-ChildItem -Path build -Recurse -Filter "AmethystRuntime.pdb" | Select-Object -First 1
          if ($dllPath) { Copy-Item $dllPath.FullName $tempPath }
          if ($pdbPath) { Copy-Item $pdbPath.FullName $tempPath }

          # Copy mod.json
          Copy-Item "mod.json" $tempPath -Force

          # Zip only those files
          Compress-Archive -Path "$tempPath\*" -DestinationPath $zipName -Force
          echo "Created package: $zipName"

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AmethystRuntime ${{ env.VERSION }}
          files: ${{ env.PROJECT_NAME }}@${{ env.VERSION }}.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🔑 Auto-bump the patch version in mod.json for the next build
      - name: Bump version in mod.json
        shell: pwsh
        run: |
          $json = Get-Content "mod.json" -Raw | ConvertFrom-Json
          $versionParts = $json.meta.version.split('.')
          $major = [int]$versionParts[0]
          $minor = [int]$versionParts[1]
          $patch = [int]$versionParts[2] + 1
          $newVersion = "$major.$minor.$patch"
          $json.meta.version = $newVersion
          $json | ConvertTo-Json -Depth 5 | Out-File -FilePath "mod.json" -Encoding utf8
          echo "mod.json version bumped to: $newVersion"

      # Commit only the updated mod.json and push
      - name: Commit version changes
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mod.json
          git commit -m "Build: Bump version to $env:VERSION"
          git push